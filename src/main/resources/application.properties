# --- CONFIGURACIÓN DE BASE DE DATOS ---
quarkus.datasource.db-kind=${DB_KIND:mysql}

quarkus.datasource.username=${DB_USERNAME:root}

quarkus.datasource.password=${DB_PASSWORD:Boni902490.}

quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:mysql://localhost:3306/todogrupo1}

quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}
quarkus.hibernate-orm.log.sql=true

firebase.service-account-location=${FIREBASE_SERVICE_ACCOUNT_LOCATION:none}

quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS


%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.sql-load-script=no-file
%test.firebase.service-account-location=none

# -- CONFIGURACIÓN PARA DIAGNÓSTICO EN PRODUCCIÓN --
# Muestra el detalle del error en el JSON en lugar del "Error id"
quarkus.resteasy-reactive.exception.display-cause=true
# Habilita los logs en nivel DEBUG para nuestro código
quarkus.log.category."com.itesm".level=DEBUG